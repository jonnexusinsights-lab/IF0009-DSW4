</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" aria-hidden="true" data-bespoke-marp-load="hideable"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="25">
<h2 id="flex-css">Flex CSS</h2>
<ul>
<li>Sistema de una sola dimensión <a href="https://lenguajecss.com/css/flex/que-es-flex/">Flex</a></li>
</ul>
<split-slide>
<steps>
<step>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"parent"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>4<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>5<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>6<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

</code></pre>
</step>
<step data-marpit-fragment="1" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {

    <span class="hljs-attribute">color</span>: gold;
    <span class="hljs-attribute">width</span>: <span class="hljs-built_in">var</span>(--size);

<div>
<ul>
<li>
<p>Propiedad <code>flex-direction</code>:</p>
<ul>

</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" aria-hidden="true" data-bespoke-marp-load="hideable"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="25">
<h2 id="gaps-huecos">Gaps (Huecos)</h2>
<ul>
<li>Propiedad <code>gap</code> → para añadir huecos entre items (no globales)</li>
<li>No es lo mismo <code>gap</code> (sólo entre items) que <code>padding</code> o <code>margin</code></li>
</ul>
<split-slide>
<steps>
<step>
<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">flex-direction</span>: row;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">1rem</span>;
  <span class="hljs-attribute">background</span>: <span class="hljs-number">#999</span>;

  <span class="hljs-selector-class">.item</span> {
    <span class="hljs-comment">/* ... */</span>
  }
}
</code></pre>
</step>
<step data-marpit-fragment="1" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">flex-direction</span>: row;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">2rem</span>;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">1rem</span>;
  <span class="hljs-attribute">border</span>: <span class="hljs-number">3px</span> solid black;
  <span class="hljs-attribute">column-rule</span>: <span class="hljs-number">3px</span> solid black;
  <span class="hljs-attribute">column-rule</span>-<span class="hljs-attribute">inset</span>: -<span class="hljs-number">1rem</span>;
  <span class="hljs-attribute">background</span>: <span class="hljs-number">#999</span>;
}
</code></pre>
</step>
<div class="step-indicator">1 / 2</div></steps>
<div>
<ul>
<li>Añadimos un <code>padding</code> para border exteriores</li>
<li>Ponemos líneas con <code>column-rule: 3px solid black</code></li>
<li>Aumentamos el <code>gap</code> a <code>2rem</code> para dar más espacio</li>
<li>Ajustamos: <code>border: 3px solid black</code> y <code>width: max-content</code></li>
<li><img class="emoji" draggable="false" alt="⚠" src="Layouts%20CSS_files/26a0_AY_j.svg" data-marp-twemoji=""> Ajustamos las lineas con <code>column-rule-inset: -1rem</code><br>
<strong>Pro-tip:</strong></li>
<li>Añadimos un <code>--offset: 2rem</code></li>
<li>Mutamos <code>column-rule-inset: calc(var(--offset) * -1)</code></li>
<li>Mutamos <code>padding: var(--offset)</code></li>
<li>Mutamos <code>gap: calc(var(--offset) * 2)</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" aria-hidden="true" data-bespoke-marp-load="hideable"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="25">

<li>Se dice que Flex funciona con una dimensión, pero...</li>
<li>Propiedad <code>flex-wrap*</code> → con <code>wrap</code> permite multilínea (desborda items sin deformarlos)</li>
</ul>
<split-slide>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"parent"</span>&gt;</span>

  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>5<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- ... hasta 10 --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<steps>
<step>
<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {

<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {

<div class="step-indicator">1 / 2</div></steps>

<ul>
<li>El modo <code>wrap</code> desbloquea <code>align-content</code> para alinear esas líneas extra.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" aria-hidden="true" data-bespoke-marp-load="hideable"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-cd7b5u2v="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="25">

  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>4<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>5<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"item"</span>&gt;</span>6<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

  <span class="hljs-attribute">grid-template-rows</span>: <span class="hljs-number">50px</span> <span class="hljs-number">50px</span>;

<h2 id="m%C3%A1s-caracter%C3%ADsticas-en-grid">Más características en Grid</h2>
<ul>
<li>Se pueden usar características adicionales en Grid</li>
</ul>
<split-slide>
<steps>
<step>
<pre><code class="language-css"><span class="hljs-selector-class">.grid</span> {

  <span class="hljs-attribute">grid-template-rows</span>: <span class="hljs-number">50px</span> <span class="hljs-number">50px</span>;

<step data-marpit-fragment="1" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.grid</span> {

<step data-marpit-fragment="2" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.grid</span> {

  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">100px</span> <span class="hljs-number">1</span>fr <span class="hljs-number">100px</span>;

<h2 id="extras-de-grid">Extras de Grid</h2>
<ul>
<li>Con las propiedades <code>*-items</code> y <code>*-content</code> se puede alinear elementos</li>
<li>Con <code>justify-items</code> y <code>align-items</code> (hijos, dentro de celdas)</li>
<li>Con <code>justify-content</code> y <code>align-content</code> (el propio grid)</li>
<li>Más info → <a href="https://lenguajecss.com/css/grid/alinear-centrar-css/">Alinear en Grid</a></li>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" aria-hidden="true" data-bespoke-marp-load="hideable"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="25">
<h2 id="posicionamiento-css">Posicionamiento CSS</h2>
<ul>
<li>La propiedad <code>position</code></li>
<li>5 modalidades: <code>static</code>, <code>relative</code> y <code>absolute</code> (variaciones: <code>fixed</code> y <code>sticky</code>)</li>
<li>Desplazamientos: <code>top</code>, <code>bottom</code>, <code>left</code>, <code>right</code></li>
</ul>
<split-slide style="--left:60%; --right:40%;">
<steps>
<step>
<pre><code class="language-css"><span class="hljs-selector-class">.item-1</span> {
  <span class="hljs-attribute">position</span>: relative;
  <span class="hljs-attribute">left</span>: <span class="hljs-number">5px</span>;            <span class="hljs-comment">/* → 5px (desde la izquierda) */</span>
  <span class="hljs-attribute">left</span>: -<span class="hljs-number">5px</span>;           <span class="hljs-comment">/* ← 5px (hacia la izquierda) */</span>
  <span class="hljs-attribute">top</span>: <span class="hljs-number">5px</span>;             <span class="hljs-comment">/* ↓ 5px (hacia abajo) */</span>
  <span class="hljs-attribute">top</span>: -<span class="hljs-number">5px</span>;            <span class="hljs-comment">/* ↑ 5px (hacia arriba) */</span>
}
</code></pre>
</step>
<step data-marpit-fragment="1" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.item-2</span> {
  <span class="hljs-attribute">position</span>: absolute;
  <span class="hljs-attribute">left</span>: <span class="hljs-number">0</span>;
  <span class="hljs-attribute">top</span>: <span class="hljs-number">0</span>;
}
</code></pre>
</step>
<step data-marpit-fragment="2" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {
  <span class="hljs-attribute">position</span>: relative;       <span class="hljs-comment">/* Marco (referencia) */</span>

  <span class="hljs-selector-class">.item</span> {
    <span class="hljs-attribute">position</span>: absolute;     <span class="hljs-comment">/* Busca padre != static */</span>
    <span class="hljs-attribute">left</span>: <span class="hljs-number">0</span>;
    <span class="hljs-attribute">top</span>: <span class="hljs-number">0</span>;
  }
}
</code></pre>
</step>
<step data-marpit-fragment="3" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {
  <span class="hljs-attribute">position</span>: relative;       <span class="hljs-comment">/* Marco (referencia) */</span>
  <span class="hljs-selector-class">.item</span> {
    <span class="hljs-attribute">position</span>: absolute;     <span class="hljs-comment">/* Busca padre != static */</span>
    <span class="hljs-attribute">left</span>: <span class="hljs-number">0</span>;
    <span class="hljs-attribute">top</span>: <span class="hljs-number">0</span>;
    <span class="hljs-attribute">bottom</span>: <span class="hljs-number">0</span>;
    <span class="hljs-attribute">right</span>: <span class="hljs-number">0</span>;               <span class="hljs-comment">/* Extender a 20px */</span>
  }
}
</code></pre>
</step>
<step data-marpit-fragment="4" data-bespoke-marp-fragment="inactive">
<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {
  <span class="hljs-attribute">position</span>: relative;
  <span class="hljs-selector-class">.item</span> {
    <span class="hljs-attribute">position</span>: absolute;
    <span class="hljs-attribute">inset</span>: <span class="hljs-number">0</span>;               <span class="hljs-comment">/* inset: 0 20px 0 0 */</span>
  }
}
</code></pre>
</step>
<div class="step-indicator">1 / 5</div></steps>
<div>
<ul>
<li>Posicionamiento relativo</li>
<li>Posicionamiento absoluto</li>
<li>Posicionamiento de referencia (colocar)</li>
<li>Posicionamiento de referencia → inset</li>
<li>Posicionamiento fijo (sobre el viewport)</li>
<li>Posicionamiento pegajoso</li>
</ul>
</div>
</split-slide>
</section>

<pre><code class="language-css"><span class="hljs-selector-class">.item</span> {

  &amp;<span class="hljs-selector-class">.item-3</span> { <span class="hljs-attribute">background</span>: black; <span class="hljs-attribute">top</span>: -<span class="hljs-number">80px</span>; <span class="hljs-attribute">left</span>: <span class="hljs-number">80px</span> }

  &amp;<span class="hljs-selector-class">.item-3</span> { <span class="hljs-attribute">z-index</span>: <span class="hljs-number">10</span> }

<h2 id="ritmo-funciones-de-tiempo">Ritmo (funciones de tiempo)</h2>
<ul>
<li>Constante (mismo ritmo): <code>linear</code></li>
<li><a href="https://lenguajecss.com/animaciones/timing-functions/que-son/#valores-predefinidos">Ritmos variables</a>: <code>ease</code> (por defecto), <code>ease-in</code>, <code>ease-out</code>, <code>ease-in-out</code></li>
<li><a href="https://cubic-bezier.com/#.17,.67,.83,.67">Ritmo personalizado</a>: función <code>cubic-bezier()</code></li>
<li><a href="https://lenguajecss.com/animaciones/timing-functions/linear/">Ritmo lineal personalizado</a>: función <code>linear()</code></li>
<li><a href="https://lenguajecss.com/animaciones/timing-functions/steps/">Ritmos escalonados</a>: función <code>steps()</code> → <a href="https://lenguajecss.com/animaciones/animaciones/spritesheets-css/">Ejemplo con SpriteSheets</a></li>
</ul>
<p>Se puede usar con transiciones y animaciones</p>

<h2 id="animaciones-de-scroll">Animaciones de scroll</h2>
<ul>
<li>La <a href="https://lenguajecss.com/animaciones/scroll-driven-animation/view/">función view()</a> → <a href="https://codepen.io/alons182/pen/MYjEYEQ">Ejemplo</a></li>
</ul>
<pre><code class="language-css"><span class="hljs-selector-class">.element</span> {
  <span class="hljs-attribute">background</span>: indigo;
  <span class="hljs-attribute">animation</span>: change linear both;
  <span class="hljs-attribute">animation-timeline</span>: <span class="hljs-built_in">view</span>(block <span class="hljs-number">20%</span>);
}

<span class="hljs-keyword">@keyframes</span> change {
  <span class="hljs-selector-tag">from</span> { <span class="hljs-attribute">scale</span>: <span class="hljs-number">0</span>; <span class="hljs-attribute">opacity</span>: <span class="hljs-number">0</span> }
  <span class="hljs-selector-tag">to</span> { <span class="hljs-attribute">scale</span>: <span class="hljs-number">1</span>; <span class="hljs-attribute">opacity</span>: <span class="hljs-number">1</span>; }
}

<h2 id="view-transition">View Transition</h2>
<ul>
<li>¿Qué son las <a href="https://lenguajecss.com/animaciones/view-transition/que-son/">View Transition</a>?</li>
<li>Recomendable en un <code>&lt;style&gt;</code> inline (performance)</li>
</ul>
<pre><code class="language-css"><span class="hljs-comment">/* Obligatorio */</span>
<span class="hljs-keyword">@view-transition</span> { navigation: auto }

<span class="hljs-comment">/* Opcional */</span>
<span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">view-transition-name</span>: page;
}

::<span class="hljs-built_in">view-transition-old</span>(page) { <span class="hljs-attribute">animation</span>: fade <span class="hljs-number">0.2s</span> linear forwards }
::<span class="hljs-built_in">view-transition-new</span>(page) { <span class="hljs-attribute">animation</span>: fade <span class="hljs-number">0.3s</span> linear reverse }

<span class="hljs-keyword">@keyframes</span> fade {
  <span class="hljs-selector-tag">from</span> { <span class="hljs-attribute">opacity</span>: <span class="hljs-number">1</span> }
  <span class="hljs-selector-tag">to</span> { <span class="hljs-attribute">opacity</span>: <span class="hljs-number">0</span> }
}
</code></pre>
