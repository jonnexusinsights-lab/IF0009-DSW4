<h2 id="etiquetas-html">Etiquetas HTML</h2>
<p>HTML  (hyper text markup language) fue creado para dar estructura y contenido.</p>
<p>Las etiquetas HTML tienen la siguiente estructura:</p>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">etiqueta</span> <span class="hljs-attr">atributo</span>=<span class="hljs-string">"valor"</span>&gt;</span>Contenido<span class="hljs-tag">&lt;/<span class="hljs-name">etiqueta</span>&gt;</span>
</code></pre>
<ul>
<li>los atributos HTML <strong>siempre</strong> son strings</li>
<li>Los atributos más populares: <code>id</code> y <code>class</code></li>
</ul>
</section>

<h2 id="categor%C3%ADas">Categorías</h2>
<p>Estructura general: <code>&lt;html&gt;</code>, <code>&lt;head&gt;</code> y <code>&lt;body&gt;</code><br>
Etiquetas agrupación y texto: <code>&lt;div&gt;</code>, <code>&lt;p&gt;</code> ... / <code>&lt;span&gt;</code>, <code>&lt;a&gt;</code> ...<br>
Etiquetas multimedia: <code>&lt;img&gt;</code>, <code>&lt;video&gt;</code>, <code>&lt;audio&gt;</code>, <code>&lt;iframe&gt;</code>...<br>
Etiquetas de formularios: <code>&lt;form&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;textarea&gt;</code>, ...<br>
Etiquetas de scripting + interactivas: <code>&lt;script&gt;</code>, <code>&lt;details&gt;</code>, <code>&lt;dialog&gt;</code> ...<br>
Etiquetas semánticas: <code>&lt;article&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;header&gt;</code> ...<br>
Etiquetas de metadatos: <code>&lt;title&gt;</code>, <code>&lt;link&gt;</code>, <code>&lt;meta&gt;</code> ...</p>
<p><a href="https://lenguajehtml.com/html/introduccion/tabla-periodica-html5/">Tabla periódica de los elementos HTML</a></p>

<p>Todos los documentos HTML tienen una estructura con los siguientes elementos</p>
<pre><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>

  <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"page"</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Título visual de la página<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Párrafo de texto donde colocamos información.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<h2 id="agrupaci%C3%B3n-y-texto">Agrupación y texto</h2>
<ul>
<li>Etiquetas de bloque: <code>&lt;div&gt;</code>, <code>&lt;p&gt;</code>, <code>&lt;ul&gt;</code>, <code>&lt;ol&gt;</code>... (agrupan) → Tabla</li>
<li>Etiquetas en línea: <code>&lt;span&gt;</code>, <code>&lt;strong&gt;</code>, <code>&lt;a&gt;</code>, <code>&lt;em&gt;</code>... (fragmentos de texto)</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>
  Esto es un párrafo de texto donde estamos
  <span class="hljs-tag">&lt;<span class="hljs-name">strong</span>&gt;</span>agrupando<span class="hljs-tag">&lt;/<span class="hljs-name">strong</span>&gt;</span> el <span class="hljs-tag">&lt;<span class="hljs-name">em</span>&gt;</span>contenido<span class="hljs-tag">&lt;/<span class="hljs-name">em</span>&gt;</span>.
<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="enlaces">Enlaces</h2>
<ul>
<li>Contenido de la etiqueta: Texto, imagen o contenido a enlazar.</li>
<li>Atributo <code>href</code>: Recurso o dirección URL a donde nos envía el enlace.</li>
<li>Atributo <code>target</code>: Donde se abre el enlace.</li>
<li>Atributo <code>download</code>: El recurso se descarga en lugar de abrirse.</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">"https://www.google.com"</span>&gt;</span>Google<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">"https://www.google.com"</span> <span class="hljs-attr">target</span>=<span class="hljs-string">"_blank"</span>&gt;</span>Google<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">"documento.pdf"</span> <span class="hljs-attr">download</span>&gt;</span>Documento<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">"a837b21.jpg"</span> <span class="hljs-attr">download</span>=<span class="hljs-string">"imagen.jpg"</span>&gt;</span>Desrcargar Imagen<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-5hi4gnal="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="7" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="28">
<h1 id="multimedia">Multimedia</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="multimedia-imagenes">Multimedia (Imagenes)</h2>
<ul>
<li>Etiqueta <code>&lt;img&gt;</code> (en línea, sin cierre)</li>
<li>Atributo <code>src</code>: URL de la imagen</li>
<li>Atributo <code>alt</code>: Texto alternativo (accesibilidad)</li>
<li>Atributo <code>width</code> y <code>height</code>: Tamaño de la imagen</li>
<li>El atributo <code>loading</code>: para hacer lazy load del contenido<br>
eager, lazy</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"imagen.webp"</span>
     <span class="hljs-attr">alt</span>=<span class="hljs-string">"Descripción breve de la imagen"</span>
     <span class="hljs-attr">loading</span>=<span class="hljs-string">"lazy"</span>
     <span class="hljs-attr">fetchpriority</span>=<span class="hljs-string">"low"</span>
     <span class="hljs-attr">decoding</span>=<span class="hljs-string">"async"</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="multimedia-imagenes-1">Multimedia (Imagenes)</h2>
<ul>
<li>Etiquetas modernas para imágenes: <code>&lt;picture&gt;</code> y <code>&lt;source&gt;</code></li>
<li>Permiten ofrecer diferentes formatos y resoluciones de imagen para mejorar el rendimiento y la compatibilidad.</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">picture</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">srcset</span>=<span class="hljs-string">"imagen.avif"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">srcset</span>=<span class="hljs-string">"imagen.webp"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"imagen.jpg"</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">"Descripción breve de la imagen"</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">picture</span>&gt;</span>
</code></pre>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">figure</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">picture</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">srcset</span>=<span class="hljs-string">"imagen.avif"</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">srcset</span>=<span class="hljs-string">"imagen.webp"</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"imagen.jpg"</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">"Descripción breve de la imagen"</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">picture</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">figcaption</span>&gt;</span>Descripción detallada a pie de imagen.<span class="hljs-tag">&lt;/<span class="hljs-name">figcaption</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">figure</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="multimedia-video">Multimedia (Video)</h2>
<ul>
<li>Etiqueta <code>&lt;video&gt;</code> (en línea, con cierre)</li>
<li>Atributo <code>src</code>: URL del video</li>
<li>Atributo <code>controls</code>: Muestra los controles de reproducción</li>
<li>Atributo <code>autoplay</code>: Reproduce el video automáticamente</li>
<li>Atributo <code>loop</code>: Reproduce el video en bucle</li>
<li>Atributo <code>muted</code>: Reproduce el video sin sonido</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">video</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"video.mp4"</span>
       <span class="hljs-attr">width</span>=<span class="hljs-string">"640"</span> <span class="hljs-attr">height</span>=<span class="hljs-string">"360"</span>
       <span class="hljs-attr">preload</span>=<span class="hljs-string">"metadata"</span>
       <span class="hljs-attr">poster</span>=<span class="hljs-string">"imagen.webp"</span>
       <span class="hljs-attr">controls</span> <span class="hljs-attr">loop</span> <span class="hljs-attr">muted</span> <span class="hljs-attr">playsinline</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">video</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="multimedia-video-1">Multimedia (Video)</h2>
<ul>
<li>Etiqueta <code>&lt;source&gt;</code> y <code>&lt;track&gt;</code></li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">video</span> <span class="hljs-attr">width</span>=<span class="hljs-string">"640"</span> <span class="hljs-attr">height</span>=<span class="hljs-string">"360"</span> <span class="hljs-attr">controls</span> <span class="hljs-attr">loop</span> <span class="hljs-attr">muted</span> <span class="hljs-attr">playsinline</span>
       <span class="hljs-attr">preload</span>=<span class="hljs-string">"metadata"</span> <span class="hljs-attr">poster</span>=<span class="hljs-string">"imagen.webp"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"video.webm"</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"video/webm"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"video.mp4"</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"video/mp4"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">track</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"subs-es.vtt"</span> <span class="hljs-attr">srclang</span>=<span class="hljs-string">"es"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">track</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"subs-en.vtt"</span> <span class="hljs-attr">srclang</span>=<span class="hljs-string">"en"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"fallback.webp"</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">"Descripción de imagen de fallback"</span>&gt;</span>

</section>

<h2 id="multimedia-audio">Multimedia (Audio)</h2>
<ul>
<li>Etiqueta <code>&lt;audio&gt;</code> (en línea, con cierre)</li>
<li>Atributo <code>src</code>: URL del audio</li>
<li>Atributo <code>controls</code>: Muestra los controles de reproducción</li>
<li>Atributo <code>autoplay</code>: Reproduce el audio automáticamente</li>
<li>Atributo <code>loop</code>: Reproduce el audio en bucle</li>
<li>Atributo <code>muted</code>: Reproduce el audio sin sonido</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">audio</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"audio.mp3"</span> <span class="hljs-attr">controls</span> <span class="hljs-attr">loop</span> <span class="hljs-attr">autoplay</span> <span class="hljs-attr">muted</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">audio</span>&gt;</span>
</code></pre>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">audio</span> <span class="hljs-attr">controls</span> <span class="hljs-attr">loop</span> <span class="hljs-attr">muted</span> <span class="hljs-attr">preload</span>=<span class="hljs-string">"metadata"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"audio.opus"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"audio.ogg"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">source</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"audio.mp3"</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">audio</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="multimedia-iframes">Multimedia (Iframes)</h2>
<ul>
<li>Etiqueta <code>&lt;iframe&gt;</code> (en línea, con cierre)</li>
<li>Atributo <code>src</code>: URL del recurso a mostrar</li>
<li>Atributo <code>width</code> y <code>height</code>: Tamaño del iframe</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">iframe</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"https://www.youtube.com/embed/dQw4w9WgXcQ"</span> <span class="hljs-attr">width</span>=<span class="hljs-string">"560"</span> <span class="hljs-attr">height</span>=<span class="hljs-string">"315"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">iframe</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-3pwj66d2="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="14" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="28">
<h1 id="formularios">Formularios</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="formularios-html">Formularios HTML</h2>
<ul>
<li>Etiqueta <code>&lt;form&gt;</code> (con cierre)</li>
<li>Atributo <code>action</code>: URL a donde se envían los datos del formulario</li>
<li>Atributo <code>method</code>: Método de envío (GET o POST)</li>
<li>Atributo <code>enctype</code>: Tipo de codificación de los datos (por ejemplo, <code>multipart/form-data</code> para archivos)</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">action</span>=<span class="hljs-string">"/submit"</span> <span class="hljs-attr">method</span>=<span class="hljs-string">"POST"</span> <span class="hljs-attr">enctype</span>=<span class="hljs-string">"multipart/form-data"</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- Campos del formulario --&gt;</span>
   <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">name</span>=<span class="hljs-string">"q"</span> <span class="hljs-attr">value</span>=<span class="hljs-string">"lenguajehtml"</span>&gt;</span>
   <span class="hljs-tag">&lt;<span class="hljs-name">button</span>&gt;</span>Enviar<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">

<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"text"</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">"Placeholder"</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"hidden"</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"password"</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"color"</span> <span class="hljs-attr">value</span>=<span class="hljs-string">"#458855"</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"image"</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"manzdev.png"</span> <span class="hljs-attr">width</span>=<span class="hljs-string">"32"</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"reset"</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"button"</span>&gt;</span> <span class="hljs-comment">&lt;!-- Equivalente a &lt;button&gt; --&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720" class="bespoke-marp-slide" data-bespoke-marp-load="hideable" aria-hidden="true"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="28">
<h2 id="%C2%BFqu%C3%A9-es-la-sem%C3%A1ntica-en-html">¿Qué es la semántica en HTML?</h2>
<ul>
<li>Usar la etiqueta más adecuada y mínima posible.</li>
<li>Preferir estructura más lógica, clara y entendible.</li>
<li>Más accesible y fácil de mantener (No sólo para humanos, también para máquinas)</li>
</ul>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- <img class="emoji" draggable="false" alt="✅" src="Lenguaje%20HTML_files/2705_ZNMe.svg" data-marp-twemoji=""> Opción 1: HTML --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">"/indice.html"</span>&gt;</span>Acceder al índice<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span>

<span class="hljs-comment">&lt;!-- <img class="emoji" draggable="false" alt="❌" src="Lenguaje%20HTML_files/274c_ZNMe.svg" data-marp-twemoji=""> Opción 2: Javascript --&gt;</span>

<h2 id="etiquetas-sem%C3%A1nticas-en-html">Etiquetas semánticas en HTML</h2>
<ul>
<li>Etiquetas de agrupación semántica: <code>&lt;article&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;header&gt;</code>, <code>&lt;footer&gt;</code>...</li>
<li>Etiquetas de texto semántico: <code>&lt;main&gt;</code>, <code>&lt;figure&gt;</code>, <code>&lt;figcaption&gt;</code>, <code>&lt;mark&gt;</code>, <code>&lt;time&gt;</code>...</li>
<li>Etiquetas de scripting e interactivas: <code>&lt;details&gt;</code>, <code>&lt;dialog&gt;</code>, <code>&lt;summary&gt;</code>...</li>
</ul>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h2</span>&gt;</span>Título<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
  Esta es una descripción para la card.
  Aquí puedes agregar datos relevantes.
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"card-content"</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h2</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"card-title"</span>&gt;</span>Título<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"card-description"</span>&gt;</span>
    Esta es una descripción para la card.
    Aquí puedes agregar datos relevantes.
  <span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"card-button"</span>&gt;</span>Más<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>

<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">article</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"card-content"</span>&gt;</span>

  <span class="hljs-tag">&lt;/<span class="hljs-name">header</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"card-description"</span>&gt;</span>

<h2 id="popovers-emergentes">Popovers emergentes</h2>
<ul>

</ul>
<div class="grid">
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">id</span>=<span class="hljs-string">"message"</span> <span class="hljs-attr">popover</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">popovertarget</span>=<span class="hljs-string">"message"</span>

<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
